[databases]
wise-old-man         = host=db port=5432 pool_size=70
league-demonic-pacts = host=db port=5432 pool_size=7
discord-bot          = host=db port=5432 pool_size=3

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
user = postgres

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = <INSERT_POSTGRES_USER>

pool_mode = transaction
ignore_startup_parameters = extra_float_digits,search_path
max_client_conn = 500
max_prepared_statements = 200

# fallbacks
default_pool_size = 5
reserve_pool_size = 0
