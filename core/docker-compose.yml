services:
  ################## Databases ##################
  redis:
    container_name: redis
    image: redis/redis-stack-server:7.0.6-RC8
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD}"
    ports:
      - "${CORE_PRIVATE_IP}:6379:6379"
    networks:
      - generic-network
    env_file:
      - ./.env
    volumes:
      - redis-data:/data
  db:
    container_name: db
    image: postgres:14.2
    shm_size: 6g
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=2GB
      -c effective_cache_size=5GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c max_wal_size=8GB
      -c min_wal_size=2GB
      -c idle_in_transaction_session_timeout=300s
      -c autovacuum_max_workers=3
      -c autovacuum_vacuum_scale_factor=0.01
      -c autovacuum_analyze_scale_factor=0.01
      -c autovacuum_naptime=10s
      -c shared_preload_libraries='pg_stat_statements'
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track=all
    volumes:
      - /mnt/volume_lon1_02/pgdata:/var/lib/postgresql/data
    networks:
      - generic-network
    ports:
      - "${CORE_PRIVATE_IP}:5432:5432"
    env_file:
      - ./.env
    expose:
      - "5432"
  pgbouncer:
    container_name: pgbouncer
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - AUTH_TYPE=scram-sha-256
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
    ports:
      - "${CORE_PRIVATE_IP}:6432:6432"
    networks:
      - generic-network
    depends_on:
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
  ################## Core ##################
  caddy:
    container_name: caddy
    build:
      context: .
      dockerfile: caddy.dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./.env
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    volumes:
      - caddy-config:/config
      - caddy-data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - generic-network
  app:
    container_name: app
    image: wiseoldman/app:latest
    networks:
      - generic-network
    env_file:
      - ./.env
    depends_on:
      - redis
  server-api:
    container_name: server-api
    image: wiseoldman/server:latest
    env_file:
      - ./.env
    environment:
      - SERVER_TYPE=api
      - PM2_INSTANCES=2
    networks:
      - generic-network
      - metrics-network
    depends_on:
      - redis
  server-bull-board:
    container_name: server-bull-board
    image: wiseoldman/server:latest
    env_file:
      - ./.env
    environment:
      - SERVER_TYPE=bull-board
      - PM2_INSTANCES=1
    networks:
      - generic-network
    depends_on:
      - redis
  league-app:
    container_name: league-app
    image: wiseoldman/league-app:latest
    networks:
      - generic-network
    env_file:
      - ./.env
    depends_on:
      - redis
  league-server-api:
    container_name: league-server-api
    image: wiseoldman/league-server:latest
    env_file:
      - ./.env
    environment:
      - SERVER_TYPE=api
      - PM2_INSTANCES=1
    networks:
      - generic-network
      - metrics-network
    depends_on:
      - redis
  league-server-bull-board:
    container_name: league-server-bull-board
    image: wiseoldman/league-server:latest
    env_file:
      - ./.env
    environment:
      - SERVER_TYPE=bull-board
      - PM2_INSTANCES=1
    networks:
      - generic-network
    depends_on:
      - redis
  bot:
    container_name: bot
    image: wiseoldman/discord-bot:latest
    env_file:
      - ./.env
    ports:
      - "${CORE_PRIVATE_IP}:7000:7000"
    networks:
      - generic-network
      - metrics-network
  hom-bot:
    container_name: hom-bot
    image: wiseoldman/hom:latest
    env_file:
      - ./.env
    networks:
      - generic-network
    volumes:
    - ./hom-github-private-key.pem:/hom-github-private-key.pem:ro
  ################## Metrics ##################
  grafana:
    container_name: grafana
    image: grafana/grafana:10.4.7
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana-data:/var/lib/grafana
    networks:
      - metrics-network
      - generic-network
    env_file:
      - ./.env
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.21.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - metrics-network
      - generic-network
    command: --web.enable-lifecycle  --config.file=/etc/prometheus/prometheus.yml
  metrics:
    container_name: metrics
    image: wiseoldman/metrics:latest
    env_file:
      - ./.env
    networks:
      - metrics-network
    ports:
      - "${CORE_PRIVATE_IP}:3500:3500"
  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - metrics-network
    devices:
      - "/dev/kmsg"
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    expose:
      - 9100
    networks:
      - metrics-network
  postgres-exporter:
    container_name: postgres-exporter
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/wise-old-man?sslmode=disable"
    command:
      - "--auto-discover-databases"
      - "--collector.stat_statements"
      - "--collector.long_running_transactions"
      - "--collector.database_wraparound"
      - "--collector.postmaster"
    networks:
      - metrics-network
      - generic-network
    depends_on:
      - db
  pgbouncer-exporter:
    container_name: pgbouncer-exporter
    image: quay.io/prometheuscommunity/pgbouncer-exporter:v0.10.2
    command:
      - "--pgBouncer.connectionString=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=disable"
    networks:
      - metrics-network
      - generic-network
    depends_on:
      - pgbouncer
  loki:
    container_name: loki
    image: grafana/loki:3.3.2
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "${CORE_PRIVATE_IP}:3100:3100"
    networks:
      - metrics-network
  promtail:
    container_name: promtail
    image: grafana/promtail:2.9.10
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    networks:
      - metrics-network
    depends_on:
      - loki
  ################## Utils ##################
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    networks:
      - generic-network
    env_file:
      - ./.env
    ports:
      - "54321:80"
networks:
  generic-network:
  metrics-network:
volumes:
  redis-data:
  prometheus-data:
  loki-data:
  promtail-positions:
  caddy-config:
  caddy-data:
  grafana-data:
    external: true
